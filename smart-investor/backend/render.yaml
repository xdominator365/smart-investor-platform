services:
  - type: web
    name: smart-investor-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: BROKER_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MARKETAUX_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: smart_investor_db
    databaseName: smart_investor_db
    user: smart_investor_user
    region: oregon
    plan: free
